[project]
name = "chr-tools"
version = "0.1.0"
description = "Fetch, inspect and bootstrap RouterOS CHR images offline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
chr-bootstrap = "chr_tools.bootstrap:main"
chr-fetch = "chr_tools.fetch:main"
chr-info = "chr_tools.info:main"
npk-info = "chr_tools.npk:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL"]
ignore = ["PLR0913", "PLR2004"]
